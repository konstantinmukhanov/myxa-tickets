<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MYXA · Билеты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --bg2: var(--tg-theme-secondary-bg-color, #f2f2f5);
      --text: var(--tg-theme-text-color, #1b1b1d);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --btn: var(--tg-theme-button-color, #1f7a5a);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --ok: #1f9d55; --warn: #d98e04; --err: #d64545;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px 16px 28px; background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    header h1 { font-size: 18px; margin: 0; }
    header span { color: var(--hint); font-size: 13px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
    .seg button { border: 0; background: transparent; color: var(--text); padding: 10px; border-radius: 9px; font: 600 15px/1 inherit; }
    .seg button.on { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    label.small { display: block; color: var(--hint); font-size: 13px; margin: 0 0 4px 2px; }
    select, input[type=text] { width: 100%; font: 16px inherit; padding: 11px 12px; border-radius: 10px;
      border: 1px solid rgba(128,128,128,.35); background: var(--bg); color: var(--text); }
    .stats { margin: 8px 2px 12px; color: var(--hint); font-size: 14px; min-height: 20px; }
    .stats b { color: var(--text); }
    .big { display: block; width: 100%; border: 0; border-radius: 14px; padding: 18px; margin: 4px 0 12px;
      background: var(--btn); color: var(--btn-text); font: 700 18px/1 inherit; }
    .big:disabled { opacity: .55; }
    #card { border-radius: 16px; padding: 18px 16px; margin-bottom: 12px; color: #fff; display: none; }
    #card.ok { background: var(--ok); display: block; }
    #card.warn { background: var(--warn); display: block; }
    #card.err { background: var(--err); display: block; }
    #card.wait { background: var(--bg2); color: var(--text); display: block; }
    #card .t { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    #card .s { font-size: 15px; opacity: .95; }
    #card .c { font: 600 13px/1.3 ui-monospace, Menlo, monospace; opacity: .85; margin-top: 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    .ghost { border: 1px solid rgba(128,128,128,.35); background: transparent; color: var(--text);
      border-radius: 10px; padding: 11px 14px; font: 600 15px/1 inherit; white-space: nowrap; }
    .opts { display: flex; justify-content: space-between; align-items: center; margin: 14px 2px 6px; font-size: 14px; }
    .opts label { display: flex; gap: 8px; align-items: center; }
    #recent { margin-top: 14px; font-size: 13px; color: var(--hint); }
    #recent div { padding: 4px 0; border-top: 1px solid rgba(128,128,128,.18); }
    .hidden { display: none !important; }
    .msg { text-align: center; color: var(--hint); margin-top: 40px; }
  </style>
</head>
<body>
  <header><h1>🎟 Билеты MYXA</h1><span id="me"></span></header>

  <div id="app" class="hidden">
    <div class="seg">
      <button id="mSell" type="button">💵 Продажа</button>
      <button id="mCheck" type="button">🚪 Контроль</button>
    </div>

    <div id="showBox">
      <label class="small" for="show">Показ на входе</label>
      <select id="show"></select>
    </div>
    <div class="stats" id="stats"></div>

    <div id="card"><div class="t" id="cT"></div><div class="s" id="cS"></div><div class="c" id="cC"></div></div>

    <button class="big" id="scan" type="button">📷 Сканировать</button>

    <div class="row">
      <input id="manual" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Код вручную: 7KQ3-M9PX">
      <button class="ghost" id="go" type="button">Проверить</button>
    </div>

    <div class="opts">
      <label><input type="checkbox" id="cont" checked> Сканировать подряд</label>
      <button class="ghost" id="undo" type="button">↩ Отменить последнее</button>
    </div>

    <div id="recent"></div>
  </div>

  <div id="msg" class="msg">Загрузка…</div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const $ = (id) => document.getElementById(id);
    const API = new URLSearchParams(location.search).get('api');
    const store = {
      get(k) { try { return localStorage.getItem('tk_' + k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem('tk_' + k, v); } catch (e) {} },
    };
    let mode = store.get('mode') === 'check' ? 'check' : 'sell';
    let busy = false;
    let shows = [];
    const recent = [];

    function fail(text) {
      $('app').classList.add('hidden');
      $('msg').classList.remove('hidden');
      $('msg').textContent = text;
    }

    async function call(action, extra) {
      const body = Object.assign({ action, initData: tg ? tg.initData : '' }, extra || {});
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      return res.json();
    }

    function haptic(level) {
      if (!tg || !tg.HapticFeedback) return;
      tg.HapticFeedback.notificationOccurred(level === 'ok' ? 'success' : level === 'warn' ? 'warning' : 'error');
    }

    function card(level, title, sub, code) {
      const c = $('card');
      c.className = level;
      $('cT').textContent = title || '';
      $('cS').textContent = sub || '';
      $('cC').textContent = code || '';
    }

    function setStats(st) {
      if (!st) { $('stats').textContent = ''; return; }
      if (mode === 'check') {
        $('stats').innerHTML = 'Прошло <b>' + st.inPersons + '</b> из <b>' + st.soldPersons + '</b> проданных мест' +
          (st.cap ? ' · зал ' + st.cap : '');
      } else {
        $('stats').innerHTML = 'На этот показ продано <b>' + st.soldPersons + '</b>' + (st.cap ? ' из ' + st.cap : '') + ' мест';
      }
    }

    function setMode(m) {
      mode = m;
      store.set('mode', m);
      $('mSell').classList.toggle('on', m === 'sell');
      $('mCheck').classList.toggle('on', m === 'check');
      $('showBox').classList.toggle('hidden', m !== 'check');
      $('cont').checked = m === 'check';
      $('card').className = '';
      $('stats').textContent = m === 'sell' ? 'Сканируйте билет, который отдаёте за наличные.' : '';
      if (m === 'check') loadStats();
    }

    async function loadStats() {
      const code = $('show').value;
      if (!code) return;
      try {
        const r = await call('stats', { show: code });
        if (r.ok && mode === 'check') setStats(r.stats);
      } catch (e) {}
    }

    function remember(r, code) {
      const mark = r.level === 'ok' ? '✅' : r.level === 'warn' ? '⚠️' : '❌';
      const t = new Date().toTimeString().slice(0, 5);
      recent.unshift(t + ' ' + mark + ' ' + (code || '') + ' — ' + r.title);
      recent.length = Math.min(recent.length, 8);
      $('recent').innerHTML = recent.map((x) => '<div>' + x.replace(/</g, '&lt;') + '</div>').join('');
    }

    async function handle(text) {
      if (busy) return;
      busy = true;
      $('scan').disabled = true;
      card('wait', 'Проверяю…', '', '');
      try {
        const r = await call('scan', { mode, show: mode === 'check' ? $('show').value : '', code: text });
        if (!r.ok) {
          card('err', 'Ошибка', r.message || r.error || 'Сервер не ответил', '');
          haptic('err');
          return;
        }
        const res = r.result;
        card(res.level, res.title, res.sub, res.ticket ? res.ticket.code : '');
        haptic(res.level);
        remember(res, res.ticket ? res.ticket.code : String(text).slice(0, 12));
        if (res.stats) setStats(res.stats);
        if (res.level === 'ok' && $('cont').checked) setTimeout(() => { if (!busy) scan(); }, 1300);
      } catch (e) {
        card('err', 'Нет связи', 'Проверьте интернет и попробуйте ещё раз.', '');
        haptic('err');
      } finally {
        busy = false;
        $('scan').disabled = false;
      }
    }

    function scan() {
      if (mode === 'check' && !$('show').value) { card('warn', 'Выберите показ', '', ''); return; }
      if (!tg || !tg.showScanQrPopup) { card('err', 'Сканер недоступен', 'Обновите Telegram или введите код вручную.', ''); return; }
      tg.showScanQrPopup({ text: mode === 'check' ? 'Билет на вход' : 'Продажа: билет' }, (data) => {
        if (!data) return false;
        setTimeout(() => handle(data), 0);
        return true; // закрыть камеру и показать результат
      });
    }

    async function undo() {
      const go = async () => {
        card('wait', 'Отменяю…', '', '');
        try {
          const r = await call('undo');
          const res = r.ok ? r.result : { level: 'err', title: 'Ошибка', sub: r.message || '' };
          card(res.level, res.title, res.sub, '');
          haptic(res.level);
          if (r.ok) remember(res, '');
          if (mode === 'check') loadStats();
        } catch (e) { card('err', 'Нет связи', '', ''); }
      };
      if (tg && tg.showConfirm) tg.showConfirm('Отменить ваше последнее действие?', (yes) => { if (yes) go(); });
      else if (confirm('Отменить ваше последнее действие?')) go();
    }

    async function start() {
      if (!tg || !tg.initData) return fail('Откройте сканер кнопкой «📷 Открыть сканер» в служебном боте.');
      if (!API) return fail('Не указан адрес таблицы. Откройте сканер заново из бота.');
      tg.ready();
      tg.expand();
      let r;
      try { r = await call('init'); } catch (e) { return fail('Не удалось связаться с таблицей. Проверьте интернет.'); }
      if (!r.ok) return fail(r.message || 'Нет доступа.');
      $('me').textContent = r.me.name + ' · ' + r.me.role;
      shows = r.shows || [];
      const sel = $('show');
      sel.innerHTML = shows.map((s) => '<option value="' + s.code + '">' + s.label.replace(/</g, '&lt;') + '</option>').join('');
      const saved = store.get('show');
      const today = shows.find((s) => s.day === r.today);
      sel.value = shows.some((s) => s.code === saved) ? saved : today ? today.code : shows.length ? shows[0].code : '';
      $('msg').classList.add('hidden');
      $('app').classList.remove('hidden');
      setMode(mode);
    }

    $('mSell').addEventListener('click', () => setMode('sell'));
    $('mCheck').addEventListener('click', () => setMode('check'));
    $('show').addEventListener('change', () => { store.set('show', $('show').value); $('card').className = ''; loadStats(); });
    $('scan').addEventListener('click', scan);
    $('go').addEventListener('click', () => { const v = $('manual').value.trim(); if (v) { $('manual').value = ''; handle(v); } });
    $('manual').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
    $('undo').addEventListener('click', undo);
    start();
  </script>
</body>
</html>
